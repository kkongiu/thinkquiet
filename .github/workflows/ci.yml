name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (fake sysfs, no hardware)
        run: python -m unittest discover -s tests -v

      - name: Python syntax
        run: python -m py_compile bin/thinkquiet bin/thinkquiet-gui

      - name: Bash syntax
        run: bash -n install.sh uninstall.sh

      - name: Shellcheck (errors only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -S error install.sh uninstall.sh

      - name: Desktop entries
        run: |
          sudo apt-get install -y desktop-file-utils
          sed 's|@HOME@|/home/user|g' share/thinkquiet-gui.desktop.in > /tmp/thinkquiet-gui.desktop
          sed 's|@HOME@|/home/user|g' share/thinkquiet-autostart.desktop.in > /tmp/thinkquiet-autostart.desktop
          desktop-file-validate /tmp/thinkquiet-gui.desktop /tmp/thinkquiet-autostart.desktop
